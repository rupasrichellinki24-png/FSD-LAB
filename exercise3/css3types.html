<!DOCTYPE html>
<html>
<head>
    <title>CSS Example</title>

    <!-- INTERNAL CSS -->
    <style>
        p {
            color: blue;
        }
    </style>

    <!-- EXTERNAL CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- INLINE CSS -->
    <h1 style="color: red;">Inline CSS</h1>

    <!-- INTERNAL CSS -->
    <p>Internal CSS</p>

    <!-- EXTERNAL CSS -->
    <h2 class="external">External CSS</h2>

</body>
</html>
