<!DOCTYPE html>
<html>
<head>
    <title>Audio and Video</title>
</head>
<body>

<h2>Audio and Video in HTML</h2>

<h3>Audio</h3>
<audio controls>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<h3>Video</h3>
<video width="500" height="300" controls>
    <source src="video.mp4" type="video/mp4">
</video>

</body>
</html>
