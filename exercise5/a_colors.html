<!DOCTYPE html>
<html>
<head>
    <title>CSS Colors</title>

    <style>
        body {
            background-color: #F8F5FF;
            text-align: center;
            font-family: Arial;
        }

        h1 {
            color: #4C1D95;
        }

        .name {
            color: teal;
        }

        .hex {
            color: #2563EB;
        }

        .rgb {
            color: rgb(219, 39, 119);
        }
    </style>
</head>

<body>

    <h1>Different Ways of Using Colors</h1>

    <h2 class="name">Color using Name</h2>

    <h2 class="hex">Color using HEX Value</h2>

    <h2 class="rgb">Color using RGB Value</h2>

</body>
</html>
