<!DOCTYPE html>
<html>
<head>
    <title>Font and Text Properties</title>

    <style>
        body {
            background-color: #F8F5FF;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: #4C1D95;
        }

        .text {
            font-size: 26px;
            font-weight: bold;
            font-style: italic;
            text-decoration: underline;
            text-transform: uppercase;
            text-align: center;
            color: #0F766E;
        }
    </style>
</head>

<body>

    <h1>Font and Text Properties</h1>

    <p class="text">Welcome to CSS</p>

</body>
</html>
